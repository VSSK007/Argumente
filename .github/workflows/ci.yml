name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: argumente
          POSTGRES_PASSWORD: argumente
          POSTGRES_DB: argumente_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argumente" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://argumente:argumente@localhost:5432/argumente_test' || '' }}
        run: uv run pytest -q
      - name: Mediator eval (offline engine; fails on any fabricated quote)
        if: matrix.db == 'sqlite'
        env:
          ENGINE_PROVIDER: local
        run: uv run python ../../evals/run.py

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: Browser tests and quality gate
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          (cd services/api && uv sync --frozen)
          (cd apps/web && npm ci && npm run build)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Start API and web (production build)
        run: |
          (cd services/api && ARGUMENTE_DEV=1 ADMIN_EMAILS=dev@demo.local nohup uv run uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup npm run start > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs localhost:3000/login >/dev/null && curl -fs localhost:8000/health >/dev/null && break; sleep 1; done
      - name: End-to-end flows
        working-directory: e2e
        run: node flow.cjs && node preround.cjs && node lineage.cjs && node features.cjs && node understanding.cjs && node topics.cjs && node auth.cjs
      - name: Accessibility, visual regression and JS budget
        working-directory: e2e
        env:
          PERF_BUDGET: "1"
          VISUAL_SOFT: "1"
        run: node quality.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots
      - name: Server logs
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log
