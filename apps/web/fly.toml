# Fly.io. Run from this directory (it is the Docker build context): fly launch --copy-config --no-deploy
# (NOT yet run against a real Fly account.) Then: fly secrets set API_URL=https://argumente-api.fly.dev, fly deploy. See docs/DEPLOYMENT.md.
app = "argumente-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
