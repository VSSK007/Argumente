[project]
name = "argumente-api"
version = "0.1.0"
description = "Argumenté local MVP API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "anthropic>=0.70",
  "psycopg[binary]>=3.2",
  "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
