# Render Blueprint: https://render.com/docs/blueprint-spec   (NOT yet run against a real Render account; see docs/DEPLOYMENT.md)
# Free tiers sleep when idle and the free Postgres expires after 30 days: fine for a first test with friends.
databases:
  - name: argumente-db
    plan: free
    databaseName: argumente

services:
  - type: web
    name: argumente-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: argumente-db, property: connectionString }
      - key: ARGUMENTE_SECRET
        generateValue: true
      - key: ARGUMENTE_DEV
        value: "0"
      - key: WEB_ORIGIN          # e.g. https://argumente-web.onrender.com
        sync: false
      - key: WEBAUTHN_RP_ID      # the web hostname only, e.g. argumente-web.onrender.com
        sync: false
      - key: ADMIN_EMAILS        # your email: you become the moderator
        sync: false
      - key: ANTHROPIC_API_KEY   # optional; without it the offline engine is used
        sync: false
      - key: SMTP_HOST           # optional; without it sign-in links only appear in the API log
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: argumente-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free
    envVars:
      - key: API_URL             # the API's URL, e.g. https://argumente-api.onrender.com
        sync: false
